# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


# Credentials come from the environment in every environment, with no fallback
# (S1 / P0-SEC-03). development and test previously hardcoded postgres/postgres — the
# shared literal committed across the platform — and this file was gitignored, so two
# developers could not produce the same build. `fetch` raises a KeyError naming the
# missing variable rather than connecting as a default superuser.
development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "kinetix_warehouse_dev" } %>
  username: <%= ENV.fetch("DB_USERNAME") %>
  password: <%= ENV.fetch("DB_PASSWORD") %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DB_NAME") { "kinetix_warehouse_test" } %>
  username: <%= ENV.fetch("DB_USERNAME") %>
  password: <%= ENV.fetch("DB_PASSWORD") %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DB_NAME") { "kinetix_warehouse_production" } %>
    username: <%= ENV.fetch("DB_USERNAME") %>
    password: <%= ENV.fetch("DB_PASSWORD") %>
    host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
    port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  cache:
    <<: *primary_production
    database: kinetix_warehouse_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: kinetix_warehouse_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: kinetix_warehouse_production_cable
    migrations_paths: db/cable_migrate
