name: CI

# Restored and corrected. The previous version of this file was deleted on a wrong premise —
# that this repository lives on GitLab — when in fact `origin` is GitHub and this workflow is
# the CI that actually runs. What was genuinely wrong with it is fixed here:
#
#   * The test job ran `bin/rails db:test:prepare test`, which invokes **Minitest**, against a
#     suite written entirely in RSpec. Zero examples executed and the job reported green.
#   * Redis was commented out, so every spec touching the dispatch or tracking path failed or
#     was quietly skipped.
#   * The database credentials were `postgres`/`postgres` — the shared literal that was
#     committed across this platform and is invalid everywhere else now.

on:
  pull_request:
  push:
    branches: [main]

env:
  RAILS_ENV: test

jobs:
  scan-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Scan for Rails security vulnerabilities
        run: bin/brakeman --no-pager
      - name: Scan for known vulnerabilities in gems
        run: bin/bundler-audit check --update

  # No scan-js job: this service ships no JavaScript. It ran `bin/importmap audit`, and importmap-rails
  # went with the admin dashboard. There is nothing left to audit.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/rubocop -f github

  rspec:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral-not-a-deployed-credential
          POSTGRES_DB: kinetix_warehouse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=10s --health-timeout=5s --health-retries=5

      # Present, not commented out. The dispatch and tracking specs need it.
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: ci
      DB_PASSWORD: ci-ephemeral-not-a-deployed-credential
      TEST_DB_NAME: kinetix_warehouse_test
      REDIS_URL: redis://localhost:6379/0
      # No RAILS_MASTER_KEY. The credentials file holds only a secret_key_base that production never
      # reads (it takes SECRET_KEY_BASE from the store), and the test environment draws its own into
      # tmp/local_secret.txt: on 2026-10-25 the suite ran 530 examples, 0 failures, with the key file
      # moved away. Without a secret here, Dependabot's pull requests, which get no Actions secrets,
      # run the same job as everyone else's instead of failing at its first step.

      # Not secrets: the issuer and audience are public claim values, and the JWKS URL is never
      # fetched under test — spec/support/identity_tokens.rb stubs Net::HTTP.get and mints its own
      # RS256 keypair. They are here because lib/kinetix/token_verifier.rb builds every verifier
      # through require_env, which raises on a missing name, and spec/support/identity_tokens.rb
      # signs its tokens with ENV.fetch("JWT_ISSUER") / ENV.fetch("JWT_AUDIENCE"). Measured with
      # all three unset: `bundle exec rspec spec/requests` reports 29 examples, 11 failures, every
      # one of them `KeyError: key not found: "JWT_ISSUER"`. Without these lines the job is red for
      # a reason that has nothing to do with the commit under test.
      #
      # 127.0.0.1:1 rather than a name that might resolve: if the stub is ever removed, the suite
      # must fail fast on a refused connection instead of reaching a real identity service.
      JWT_ISSUER: https://identity.kinetix.local
      JWT_AUDIENCE: kinetix
      IDENTITY_JWKS_URL: http://127.0.0.1:1/.well-known/jwks.json

      # Same reasoning as the three above, for the two gRPC clients this service constructs. Each
      # host is an `ENV.fetch` with no default — deliberately, because a guessed address fails in
      # silence that reads like an answer — so any spec that resolves that branch of the container
      # needs a value, including specs about something else entirely.
      #
      # Port 1 for the same reason as the JWKS URL: nothing listens there, so a spec that ever
      # tries to make a real call fails on a refused connection rather than reaching a service.
      # For identity that is exactly right: a refused connection is `Identity::Unavailable`, which
      # is 503 — never a decision about the account.
      ORDER_GRPC_HOST: 127.0.0.1:1
      IDENTITY_GRPC_HOST: 127.0.0.1:1
      KINETIX_TIME_ZONE: Asia/Jakarta
      WAREHOUSE_LOW_STOCK_THRESHOLD: "5"

    steps:
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # db:schema:load, not db:prepare. db:prepare seeds a database it considers newly set
      # up, and db/seeds.rb creates the same merchant codes the request specs create in their
      # own `let!` blocks — thirteen specs fail on "Code has already been taken" for a reason
      # that has nothing to do with the code under test.
      - name: Load the schema
        run: bin/rails db:schema:load

      # RSpec, not `rails test`. `rails test` runs Minitest, finds no Minitest files, and exits
      # 0 — which is how this suite reported green while executing nothing.
      - name: Run RSpec
        run: bundle exec rspec --format progress --format json --out rspec.json

      # A suite that discovers no examples is a failed suite. This is the exact failure the
      # previous workflow had for its entire life, so it is asserted rather than assumed.
      - name: Assert the suite actually ran
        run: |
          count=$(ruby -rjson -e 'puts JSON.parse(File.read("rspec.json"))["summary"]["example_count"]')
          echo "executed $count examples"
          test "$count" -ge 30 || {
            echo "expected at least 30 examples, ran $count — the suite is not being discovered"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rspec-report
          path: rspec.json
          retention-days: 7
