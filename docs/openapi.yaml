openapi: 3.0.3
info:
  title: Kinetix warehouse API
  version: 1.1.0
  description: >-
    The warehouse's REST surface, reached through the gateway, which strips `/api/v1/warehouse` to the
    service's own `/api/v1`. Every call carries an access token issued by identity. Seller calls need a
    token whose role is `seller`, and identity is asked about the merchant on every one of them; staff
    calls need the `admin` role. `/health`, `/health/ready` and `/metrics` are served to the platform
    only and are not routed through the gateway.
servers:
  - url: /api/v1/warehouse
    description: the gateway
security:
  - identityToken: []
paths:
  /fulfillment_tasks:
    get:
      summary: Find the seller's task for an order number, whatever its state
      description: >-
        For opening a return: a task leaves the queue once its label is printed, and a return is opened by
        task id. Answers a list, empty when the caller's merchant has no task for that order; another
        merchant's task for the same order number is never answered. Cancelled and printed tasks are
        included.
      tags: [seller]
      parameters:
        - in: query
          name: order_number
          required: true
          description: Matched exactly, after surrounding spaces are taken off
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: The tasks for that order number (at most one per merchant)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskRecord' }
        '400':
          description: '`order_number` is missing, blank, not a single string, or holds a NUL character'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refusal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotASeller' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /fulfillment_tasks/queue:
    get:
      summary: The seller's work left to do
      description: >-
        Tasks still to pack (`received`, `packing`) and packed parcels whose label has not been printed
        yet, earliest cutoff first. Cancelled tasks and printed parcels are not on it.
      tags: [seller]
      responses:
        '200':
          description: The queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotASeller' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /fulfillment_tasks/{id}/status:
    patch:
      summary: Move a task forward
      description: >-
        `received → packing → packed`, one step at a time. A `packing` task becomes `packed` only once
        every line has been matched by a scan; until then the move is refused with how many lines are
        left. Setting `packed` again re-sends the report to order. Reaching `packed` tells order, which
        dispatches a courier. A missing or blank `status` is refused with `status is required: name the
        state to move the task to`.
      tags: [seller]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [received, packing, packed, cancelled] }
      responses:
        '200':
          description: The task moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskMove' }
        '400': { $ref: '#/components/responses/UnreadableBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotASeller' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '422': { $ref: '#/components/responses/Refused' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /fulfillment_tasks/{id}/label:
    post:
      summary: Print the parcel's label
      description: >-
        The label carries the tracking number the fleet issued. The first print is not a reprint. A
        cancelled task has no label to print.
      tags: [seller]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The label
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotASeller' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '422': { $ref: '#/components/responses/Refused' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /fulfillment_tasks/{id}/verify_scan:
    post:
      summary: Scan a parcel's line, order number or tracking number
      description: >-
        A SKU on the task, its order number or its tracking number matches; anything else is refused.
        A code longer than 128 characters, the longest SKU warehouse keeps, is refused before it is read.
        A SKU marks its line scanned, once: scanning a line again changes nothing. The first matching
        scan of a `received` task moves it to `packing`; the task becomes `packed` when its last line is
        scanned, and that scan tells order. The order number and the tracking number match no line, so
        they never pack a parcel. A scan of a `packed` parcel changes nothing and does not report it to
        order again; set the status to `packed` for that.
      tags: [seller]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scanned_code]
              properties:
                scanned_code: { type: string, maxLength: 128 }
      responses:
        '200':
          description: The scan matched; `new_status` is where the task is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResult' }
        '400': { $ref: '#/components/responses/UnreadableBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotASeller' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '422': { $ref: '#/components/responses/Refused' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /fulfillment_tasks/{fulfillment_task_id}/returns:
    post:
      summary: Open a return with order for a task's order
      description: >-
        The reason is at most 500 characters, which is what order keeps; a character outside the Basic
        Multilingual Plane (an emoji) counts as two, as order counts it. A reason of whitespace only, Unicode
        spaces included, is refused. An error status from order is answered in warehouse's own words:
        `ORDER_NOT_FOUND` (404), `ORDER_INVALID_REQUEST` (422), `ORDER_CONFLICT` (409), `ORDER_FAILED` (502),
        `ORDER_UNAVAILABLE` (503, nothing recorded), `ORDER_TIMEOUT` (503, outcome unknown; repeat the request,
        which answers `already_open` when order did record it).
      tags: [seller]
      parameters:
        - in: path
          name: fulfillment_task_id
          required: true
          description: ASCII digits only; any other spelling names no task and is 404
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: Order opened the return
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenedReturn' }
        '200':
          description: The return was already open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenedReturn' }
        '400': { $ref: '#/components/responses/UnreadableBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotASeller' }
        '404':
          description: >-
            The caller's merchant has no task with that id, or the id is not written in digits; or
            `ORDER_NOT_FOUND`, order's own not-found status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refusal' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/ReturnRefused' }
        '502': { $ref: '#/components/responses/OrderRefused' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /returns/{return_number}/received:
    post:
      summary: Report returned goods back on a shelf
      description: >-
        The return number is read before anything else but the caller's standing: one not in order's
        format names no return and is `404 Return not found`, and order is not asked. `bin_code` may be
        left out or `null` when the goods went into no bin; order then records no bin. A `bin_code` of
        whitespace only is refused. A line's SKU is at most 128 characters. An error status from order is
        answered as on opening a return.
      tags: [seller]
      parameters:
        - in: path
          name: return_number
          required: true
          description: Order's format, `RMA-<yyyymmdd>-<8 upper-case hex digits>`
          schema: { type: string, pattern: '^RMA-[0-9]{8}-[0-9A-F]{8}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                bin_code: { type: string, minLength: 1, maxLength: 64, nullable: true }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, quantity]
                    properties:
                      sku: { type: string, minLength: 1, maxLength: 128 }
                      quantity: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        '200':
          description: Order recorded the goods
          content:
            application/json:
              schema:
                type: object
                properties:
                  return_number: { type: string }
                  already_recorded: { type: boolean }
        '400':
          description: The body is unreadable, or `lines` is not a list of objects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refusal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotASeller' }
        '404':
          description: >-
            `Return not found`: the return number is not in order's format; or `ORDER_NOT_FOUND`, order's own
            not-found status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refusal' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/ReturnRefused' }
        '502': { $ref: '#/components/responses/OrderRefused' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /merchants/me:
    get:
      summary: The caller's own merchant row
      description: Its `id` is what `PATCH /merchants/{id}` takes.
      tags: [seller]
      responses:
        '200':
          description: The merchant
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  principal_id: { type: string, format: uuid }
                  cutoff_hour: { type: integer, minimum: 0, maximum: 23 }
                  may_sell: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotASeller' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /merchants/{id}:
    patch:
      summary: Set the same-day packing cutoff hour
      description: >-
        The hour is read on the platform's clock (`KINETIX_TIME_ZONE`). Only a merchant identity permits
        to trade may change it.
      tags: [seller]
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody: { $ref: '#/components/requestBodies/Cutoff' }
      responses:
        '200': { $ref: '#/components/responses/CutoffSet' }
        '400': { $ref: '#/components/responses/UnreadableBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotASeller' }
        '404': { $ref: '#/components/responses/MerchantNotFound' }
        '422': { $ref: '#/components/responses/Refused' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
    put:
      summary: Set the same-day packing cutoff hour (same as PATCH)
      tags: [seller]
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody: { $ref: '#/components/requestBodies/Cutoff' }
      responses:
        '200': { $ref: '#/components/responses/CutoffSet' }
        '400': { $ref: '#/components/responses/UnreadableBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotASeller' }
        '404': { $ref: '#/components/responses/MerchantNotFound' }
        '422': { $ref: '#/components/responses/Refused' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /bins:
    post:
      summary: Create a bin, or update the one with that code
      tags: [staff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bin_code, zone]
              properties:
                bin_code: { type: string, minLength: 1, maxLength: 64 }
                zone: { type: string, minLength: 1, maxLength: 64 }
                shelf_level:
                  type: integer
                  minimum: 0
                  maximum: 2147483647
                  description: A JSON integer or a string of digits; left as it is when absent, null or empty
      responses:
        '201':
          description: The bin was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bin' }
        '200':
          description: The bin existed and was updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bin' }
        '400': { $ref: '#/components/responses/UnreadableBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotStaff' }
        '422': { $ref: '#/components/responses/Refused' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /stock_receipts:
    post:
      summary: Book goods in
      description: >-
        `merchant_principal_id` is whose goods these are; identity must know it as a merchant. The key is
        one merchant's: the same key and the same receipt replay, the same key and a different receipt is
        a conflict.
      tags: [staff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bin_code, sku, quantity, idempotency_key, merchant_principal_id]
              properties:
                bin_code: { type: string, maxLength: 64 }
                sku: { type: string, minLength: 1, maxLength: 128 }
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: A JSON integer or a string of digits; `true`, `2.9` or `"12abc"` are refused
                idempotency_key: { type: string, maxLength: 255 }
                merchant_principal_id: { type: string, format: uuid }
                note: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: The goods were booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '200':
          description: A replay of a receipt already booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/MissingField' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotStaff' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/StockRefused' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /stock_adjustments:
    post:
      summary: Write stock off, or correct a count
      tags: [staff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bin_code, sku, quantity_delta, reason, idempotency_key, merchant_principal_id]
              properties:
                bin_code: { type: string, maxLength: 64 }
                sku: { type: string }
                quantity_delta:
                  type: integer
                  minimum: -2147483648
                  maximum: 2147483647
                  not: { enum: [0] }
                  description: A JSON integer or a string of digits with an optional sign
                reason: { type: string, enum: [DAMAGE, SHRINKAGE, MISCOUNT, RETURN_TO_SUPPLIER, EXPIRY] }
                idempotency_key: { type: string, maxLength: 255 }
                merchant_principal_id: { type: string, format: uuid }
                note: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: The adjustment was made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adjustment' }
        '200':
          description: A replay of an adjustment already made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adjustment' }
        '400': { $ref: '#/components/responses/MissingField' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotStaff' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/StockRefused' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
components:
  securitySchemes:
    identityToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TaskId:
      in: path
      name: id
      required: true
      description: ASCII digits only; any other spelling (`12abc`, `+12`, `0x10`, ` 12`) names no task and is 404
      schema: { type: integer, minimum: 1 }
    MerchantId:
      in: path
      name: id
      required: true
      description: >-
        The `id` from `GET /merchants/me`, in ASCII digits only; any other spelling names no merchant and is
        404
      schema: { type: integer, minimum: 1 }
  requestBodies:
    Cutoff:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [cutoff_hour]
            properties:
              cutoff_hour: { type: integer, minimum: 0, maximum: 23 }
  responses:
    Unauthorized:
      description: No token, or a token identity did not issue
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    NotASeller:
      description: >-
        `NOT_A_SELLER` (the token's role is not `seller`), `NOT_A_MERCHANT` (identity knows no merchant
        for the caller), `MERCHANT_NOT_TRADING` (identity does not permit the merchant to trade), or a
        merchant row that is not the caller's
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    NotStaff:
      description: The token's role is not `admin`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    TaskNotFound:
      description: The caller's merchant has no task with that id, or the id is not written in digits
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    MerchantNotFound:
      description: The id is not written in digits, so it names no merchant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    Refused:
      description: >-
        The request was understood and refused; `error` says why. A string field sent as another JSON type
        (a number, a boolean, a list, an object) or holding a NUL character is refused here, `error` naming
        the field, before anything is read or written.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    StockRefused:
      description: >-
        The request was understood and refused; `error` says why. Coded refusals carry a `message`:
        `INVALID_QUANTITY` / `INVALID_DELTA` (not a whole number in range), `INVALID_IDEMPOTENCY_KEY`
        (longer than 255 characters), `INVALID_BIN_CODE` (longer than 64 characters), `INVALID_NOTE` (longer
        than 1000 characters), `STOCK_LIMIT_EXCEEDED` (the bin would hold more than 2147483647 units of the
        sku), `UNKNOWN_MERCHANT`. A string field sent as another JSON type or holding a NUL character is
        `INVALID_<FIELD>` (`INVALID_SKU`, `INVALID_MERCHANT_PRINCIPAL_ID`, `INVALID_REASON`, …). Nothing was
        written.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    MissingField:
      description: A required field is missing, `merchant_principal_id` is not a UUID, or the body is unreadable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    UnreadableBody:
      description: '`INVALID_REQUEST`: the body could not be parsed as the content type it declares'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    Conflict:
      description: >-
        `IDEMPOTENCY_KEY_CONFLICT` (that key already did something different for this merchant), or the
        stock belongs to another merchant, or the write would cut into reserved stock
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    ReturnRefused:
      description: >-
        The request was understood and refused; `error` says why, as for any refusal. Or
        `ORDER_INVALID_REQUEST`: order answered `INVALID_ARGUMENT`, so nothing was recorded and sending the
        same request again will not help.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    OrderConflict:
      description: >-
        `ORDER_CONFLICT`: order answered `FAILED_PRECONDITION` or `ALREADY_EXISTS`, refusing the request
        because of the state its records are in; nothing was recorded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    OrderRefused:
      description: >-
        `RETURN_NOT_RECORDED`: order answered and refused; `message` is order's reason. Or `ORDER_FAILED`:
        order answered any other error status (its own failure, or a refusal of warehouse itself on order's
        mesh allow list), or an answer warehouse cannot use; whether order recorded anything is not known,
        and sending the same request again is safe. Order's own words are never passed on.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    IdentityUnavailable:
      description: >-
        `IDENTITY_UNAVAILABLE`: identity could not be asked, so nothing was applied. Or
        `DATABASE_UNAVAILABLE`: warehouse could not reach its database, so the request could not be completed
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    DatabaseUnavailable:
      description: >-
        `DATABASE_UNAVAILABLE`: warehouse could not reach its database, so the request could not be
        completed
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    DependencyUnavailable:
      description: >-
        `IDENTITY_UNAVAILABLE`; `ORDER_UNAVAILABLE` (order could not be reached, or answered `UNAVAILABLE` or
        `RESOURCE_EXHAUSTED`: nothing was recorded); `ORDER_TIMEOUT` (order did not answer within 5 seconds:
        whether it recorded the request is not known, and repeating it is safe because order answers
        `already_open` / `already_recorded`); or `DATABASE_UNAVAILABLE`. Try again after `Retry-After`
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    CutoffSet:
      description: The cutoff hour was set
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: integer }
              cutoff_hour: { type: integer }
  schemas:
    Refusal:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        traceId: { type: string }
    TaskLine:
      type: object
      properties:
        sku: { type: string }
        quantity: { type: integer }
        bin_location:
          type: string
          description: The bin the order's stock was reserved from; empty when no reservation names one
        scanned:
          type: boolean
          description: Whether a scan has matched this line
    TaskCard:
      type: object
      properties:
        id: { type: integer }
        order_number: { type: string }
        status: { type: string, enum: [received, packing, packed] }
        same_day_cutoff_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        tracking_number: { type: string, nullable: true }
        sla_urgency: { type: string, enum: [overdue, due_soon, due_today, packed] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/TaskLine' }
    TaskMove:
      type: object
      properties:
        id: { type: integer }
        order_number: { type: string }
        status: { type: string }
        updated_at: { type: string, format: date-time }
        order_notified: { type: boolean }
        notify_error: { type: string, nullable: true }
        dispatch_ref: { type: string, nullable: true }
    TaskRecord:
      type: object
      properties:
        id: { type: integer }
        order_number: { type: string }
        status: { type: string, enum: [received, packing, packed, cancelled] }
