# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

AllCops:
  Exclude:
    # Generated by protoc. Every offence here is protoc's formatting choice, not a decision
    # anyone made — single-quoted strings, no blank line after the magic comment. Autocorrecting
    # them would be undone by the next `protoc` run, so the lint would fail again on a file
    # nobody edited. Regenerating is the only way these change, and it reproduces them exactly.
    - 'lib/generated/**/*'
    # Sorbet RBI stubs, generated from gems. Same reasoning.
    - 'sorbet/rbi/**/*'
    # Vendored dependencies and build output are not this project's code to style.
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'db/schema.rb'
