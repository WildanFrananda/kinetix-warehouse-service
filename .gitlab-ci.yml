# Kinetix warehouse CI — GitLab.
#
# ⚠ PAIRED FILE: .github/workflows/ci.yml
# `origin` is GitHub and GitLab is a mirror. Both assert the same things and must be changed
# together; if they drift, the two platforms disagree about whether the same commit is good.
#
# Replaces a GitHub Actions workflow that never ran — this repository's origin is gitlab.com,
# so `.github/workflows/ci.yml` was inert config. Left running, it would have been worse than
# nothing: it invoked `bin/rails db:test:prepare test`, which runs **Minitest**, against a
# suite written entirely in RSpec. Zero examples executed and the job reported green.
#
# Four things that workflow was missing and this one has:
#   1. RSpec, so the 18 spec files are actually executed.
#   2. A test-count floor, so an empty run fails instead of passing.
#   3. Redis, which the dispatch and tracking specs need.
#   4. RAILS_MASTER_KEY, which was commented out, so anything touching credentials blew up.
#
# The database credentials here are per-pipeline, not the postgres/postgres literal the old
# workflow used — that literal is one of the values this platform spent S1 invalidating.

include:
  - project: 'WildanFrananda/kinetix-infrastructure'
    ref: main
    file: '/ci/service-ci.yml'

stages:
  - verify
  - build
  - test

variables:
  RAILS_ENV: test
  BUNDLE_PATH: vendor/bundle

cache:
  key:
    files:
      - Gemfile.lock
  paths:
    - vendor/bundle

.ruby:
  image: ruby:4.0.6
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends libpq-dev libvips
    - gem install bundler --conservative
    - bundle install --jobs 4

secret-scan:
  extends: .secret-scan

lint:
  extends: .ruby
  stage: verify
  script:
    - bundle exec rubocop --format simple
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security-scan:
  extends: .ruby
  stage: verify
  script:
    - bundle exec brakeman --no-pager
    - bundle exec bundler-audit check --update
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-image:
  extends: .build-image

rspec:
  extends: .ruby
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7.2-alpine
      alias: redis
  variables:
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci-ephemeral-not-a-deployed-credential
    POSTGRES_DB: kinetix_warehouse_test
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USERNAME: ci
    DB_PASSWORD: ci-ephemeral-not-a-deployed-credential
    TEST_DB_NAME: kinetix_warehouse_test
    REDIS_URL: redis://redis:6379/0
    # Masked, protected CI variable. Commented out in the old workflow, which meant any spec
    # touching encrypted credentials failed for a reason nobody ever saw.
    RAILS_MASTER_KEY: $RAILS_MASTER_KEY
  script:
    - |
      # A shape check, not just a presence check. Rails' master key is 32 hex characters that
      # decode to exactly 16 bytes; one stray newline or space makes it decode to something
      # else, and Rails dies with "ArgumentError: key must be 16 bytes" from deep inside
      # ActiveSupport, sixty stack frames away from the cause. This says it plainly instead.
      #
      # Only the length and character class are reported. Neither of those is the secret.
      if [ -z "$RAILS_MASTER_KEY" ]; then
        echo "RAILS_MASTER_KEY is not set."
        echo "Add it under Settings > CI/CD > Variables, masked and protected."
        exit 1
      fi
      len=$(printf '%s' "$RAILS_MASTER_KEY" | wc -c | tr -d ' ')
      if [ "$len" -ne 32 ]; then
        echo "RAILS_MASTER_KEY is $len characters; it must be exactly 32."
        echo "A trailing newline or space is the usual cause: copying the file in an editor"
        echo "picks one up. Re-copy it with:"
        echo "    tr -d '\\n' < config/master.key | pbcopy"
        exit 1
      fi
      if ! printf '%s' "$RAILS_MASTER_KEY" | grep -qE '^[a-f0-9]{32}$'; then
        echo "RAILS_MASTER_KEY is 32 characters but is not lowercase hexadecimal."
        exit 1
      fi
      echo "RAILS_MASTER_KEY is 32 hex characters, as required"
    - bundle exec rails db:schema:load
    - bundle exec rspec --format progress --format json --out rspec.json
    # A suite that runs no examples is a failed suite, not a passing one. This is the exact
    # failure mode the previous pipeline had for its entire life.
    - |
      count=$(ruby -rjson -e 'puts JSON.parse(File.read("rspec.json"))["summary"]["example_count"]')
      echo "executed $count examples"
      test "$count" -ge 30 || { echo "expected at least 30 examples, ran $count — the suite is not being discovered"; exit 1; }
  artifacts:
    when: always
    paths:
      - rspec.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
