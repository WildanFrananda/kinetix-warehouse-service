# Kinetix warehouse CI — GitLab.
#
# ⚠ PAIRED FILE: .github/workflows/ci.yml
# `origin` is GitHub and GitLab is a mirror. Both assert the same things and must be changed
# together; if they drift, the two platforms disagree about whether the same commit is good.
#
# Written alongside a GitHub Actions workflow that was broken rather than absent — an earlier
# revision of this header claimed origin was gitlab.com and that `.github/workflows/ci.yml` was
# therefore inert. That was wrong, and it contradicted the paired-file note three lines above it:
# origin is GitHub, this is the mirror, and BOTH files run. What was actually wrong with that
# workflow is fixed in it, not worked around here: it invoked `bin/rails db:test:prepare test`,
# which runs **Minitest**, against a suite written entirely in RSpec. Zero examples executed and
# the job reported green.
#
# Three things that workflow was missing and this one has:
#   1. RSpec, so the 18 spec files are actually executed.
#   2. A test-count floor, so an empty run fails instead of passing.
#   3. Redis, which the dispatch and tracking specs need.
#
# The database credentials here are per-pipeline, not the postgres/postgres literal the old
# workflow used — that literal is one of the values this platform spent S1 invalidating.

include:
  - project: 'WildanFrananda/kinetix-infrastructure'
    ref: main
    file: '/ci/service-ci.yml'

stages:
  - verify
  - build
  - test

variables:
  RAILS_ENV: test
  BUNDLE_PATH: vendor/bundle

cache:
  key:
    files:
      - Gemfile.lock
  paths:
    - vendor/bundle

.ruby:
  image: ruby:4.0.6
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends libpq-dev libvips
    - gem install bundler --conservative
    - bundle install --jobs 4

secret-scan:
  extends: .secret-scan

lint:
  extends: .ruby
  stage: verify
  script:
    - bundle exec rubocop --format simple
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security-scan:
  extends: .ruby
  stage: verify
  script:
    - bundle exec brakeman --no-pager
    - bundle exec bundler-audit check --update
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-image:
  extends: .build-image

rspec:
  extends: .ruby
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7.2-alpine
      alias: redis
  variables:
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci-ephemeral-not-a-deployed-credential
    POSTGRES_DB: kinetix_warehouse_test
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USERNAME: ci
    DB_PASSWORD: ci-ephemeral-not-a-deployed-credential
    TEST_DB_NAME: kinetix_warehouse_test
    REDIS_URL: redis://redis:6379/0
    # No RAILS_MASTER_KEY: the suite needs none (see .github/workflows/ci.yml, where this was measured).
    # Not secrets: the issuer and audience are public claim values, and the JWKS URL is never
    # fetched under test — spec/support/identity_tokens.rb stubs Net::HTTP.get and mints its own
    # RS256 keypair. They are here because lib/kinetix/token_verifier.rb builds every verifier
    # through require_env, which raises on a missing name, and spec/support/identity_tokens.rb
    # signs its tokens with ENV.fetch("JWT_ISSUER") / ENV.fetch("JWT_AUDIENCE"). Measured with all
    # three unset: `bundle exec rspec spec/requests` reports 29 examples, 11 failures, every one of
    # them `KeyError: key not found: "JWT_ISSUER"`. Without these lines the job is red for a reason
    # that has nothing to do with the commit under test.
    #
    # 127.0.0.1:1 rather than a name that might resolve: if the stub is ever removed, the suite
    # must fail fast on a refused connection instead of reaching a real identity service.
    JWT_ISSUER: https://identity.kinetix.local
    JWT_AUDIENCE: kinetix
    IDENTITY_JWKS_URL: http://127.0.0.1:1/.well-known/jwks.json

    # The two gRPC clients this service constructs. Both hosts are an `ENV.fetch` with no default,
    # so a spec that resolves that branch of the container fails with a bare KeyError without them.
    # Port 1 listens nowhere: a spec that makes a real call fails on a refused connection rather
    # than reaching a service. For identity a refused connection is `Identity::Unavailable`, which
    # is 503 — never a decision about the account.
    ORDER_GRPC_HOST: 127.0.0.1:1
    IDENTITY_GRPC_HOST: 127.0.0.1:1
    KINETIX_TIME_ZONE: Asia/Jakarta
    WAREHOUSE_LOW_STOCK_THRESHOLD: "5"
  script:
    - bundle exec rails db:schema:load
    - bundle exec rspec --format progress --format json --out rspec.json
    # A suite that runs no examples is a failed suite, not a passing one. This is the exact
    # failure mode the previous pipeline had for its entire life.
    - |
      count=$(ruby -rjson -e 'puts JSON.parse(File.read("rspec.json"))["summary"]["example_count"]')
      echo "executed $count examples"
      test "$count" -ge 30 || { echo "expected at least 30 examples, ran $count — the suite is not being discovered"; exit 1; }
  artifacts:
    when: always
    paths:
      - rspec.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
